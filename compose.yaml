services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: app-dev
    # --clear-screen=false keeps previous runs visible in docker logs
    command: npx tsx watch --clear-screen=false src/index.ts
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app # live source from the host
      - ./workspace:/workspace # live source from the host
      # Agent instructions read live from the host — editing CLAUDE.md needs
      # no image rebuild. (The Dockerfile still COPY's it for prod images.)
      - ./CLAUDE.md:/home/agent/.claude/CLAUDE.md
      - node_modules:/app/node_modules # deps come from the image, not the host

volumes:
  node_modules:
